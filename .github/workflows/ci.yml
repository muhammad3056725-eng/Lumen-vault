# Pull-request gate: typecheck, engine + web tests, Python pipeline tests,
# data rebuild reproducibility, and a production build.
name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - name: Dataset rebuild is reproducible
        run: |
          npm run data
          git diff --stat -- public/data/v1 ':!public/data/v1/manifest.json' ':!public/data/v1/daily/latest.json'
          git diff --quiet -- public/data/v1 ':!public/data/v1/manifest.json' ':!public/data/v1/daily/latest.json'
      - run: npm test
        env:
          CI: "true"
      - run: npm run build
