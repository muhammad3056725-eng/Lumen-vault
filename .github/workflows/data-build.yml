# LUMEN VAULT — Wikidata data build.
# Pulls notable works from Wikidata (ordered by sitelinks, adult genres
# excluded), appends genuinely new ones to tools/seed/ingested.json,
# rebuilds public/data/v1 with `npm run data` (which re-proves every
# chamber), runs the full test suite, commits, and then deploys via the
# Pages workflow. The curated seed is never overwritten.
name: Wikidata Data Build
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max Wikidata rows per class"
        required: false
        default: "300"
      min_sitelinks:
        description: "Minimum Wikipedia sitelinks for an item to be admitted"
        required: false
        default: "40"
  schedule:
    - cron: "0 4 1 * *" # monthly, 04:00 UTC on the 1st
permissions:
  contents: write
jobs:
  grow-dataset:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r pipeline/requirements.txt
      - run: npm ci
      - name: Ingest from Wikidata
        run: python pipeline/ingest_wikidata.py --limit ${{ inputs.limit || '300' }} --min-sitelinks ${{ inputs.min_sitelinks || '40' }}
      - name: Tag facets and append new entities to tools/seed/ingested.json
        run: python pipeline/tag_facets.py --merge
      - name: Rebuild and re-prove the dataset
        run: npm run data
      - name: Validate (solvability proofs + all tests)
        run: |
          python pipeline/verify_solvability.py
          npm test
        env:
          CI: "true"
      - name: Commit the enlarged dataset
        id: commit
        run: |
          git config user.name "LumenVault-Bot"
          git config user.email "lumenvault-bot@users.noreply.github.com"
          git add tools/seed/ingested.json public/data/v1
          if git diff --cached --quiet; then
            echo "Dataset unchanged — nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data(wikidata): enlarge entity dictionary"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: grow-dataset
    if: needs.grow-dataset.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
